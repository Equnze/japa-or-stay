<title>Japa or Stay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one phone-width column. Header with an Ankara strip, a status board, then the phase card (plan / life / settle). */
:root {
  --bg: #EEF2EC;
  --surface: #FFFFFF;

  --ink: #13201A;
  --muted: #5A6A61;
  --line: #D6DED6;
  --stay: #0E7A4C;        /* naija green = Stay */
  --japa: #3346A8;        /* passport indigo = Japa */
  --gold: #D99A0E;        /* marigold = money */
  --bad: #B83A2E;
  --good: #1D8A55;
  --chip: #E6EDE5;
  /* illustration palette */
  --sky: #CFE6EE; --sky-cold: #D5DCE6; --sun: #F3B53A; --sil: #2F4A3F; --water: #6FA6BF; --sand: #E2C58F;
  --mud: #C27D4B; --mud2: #A9653A; --hill: #3E8C5A; --hill2: #66AE6E; --roof: #B84A2C; --snow: #F7F8FA; --house: #8A6E5E;
  --paper: #F7F3E8; --ink-soft: #3A4A42; --portrait-bg: #DCE8DF; --icon-bg: #2C3E35;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1411; --surface: #16201B; --surface-2: #1B2721; --ink: #E6EEE8; --muted: #94A59B;
    --line: #2A3830; --stay: #3FC184; --japa: #8F9DFF; --gold: #F0B637; --bad: #F07A6C; --good: #4FD08F; --chip: #22302A;
    --sky: #1E3440; --sky-cold: #2A3038; --sun: #E8A93A; --sil: #0E1A15; --water: #2C4F60; --sand: #7C6440;
    --mud: #8C5532; --mud2: #74442A; --hill: #23573A; --hill2: #2F6E45; --roof: #8A3A22; --snow: #C9CED6; --house: #5A473D;
    --paper: #E9E4D6; --ink-soft: #33413A; --portrait-bg: #24332B; --icon-bg: #2C3E35;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1411; --surface: #16201B; --surface-2: #1B2721; --ink: #E6EEE8; --muted: #94A59B;
  --line: #2A3830; --stay: #3FC184; --japa: #8F9DFF; --gold: #F0B637; --bad: #F07A6C; --good: #4FD08F; --chip: #22302A;
    --sky: #1E3440; --sky-cold: #2A3038; --sun: #E8A93A; --sil: #0E1A15; --water: #2C4F60; --sand: #7C6440;
    --mud: #8C5532; --mud2: #74442A; --hill: #23573A; --hill2: #2F6E45; --roof: #8A3A22; --snow: #C9CED6; --house: #5A473D;
    --paper: #E9E4D6; --ink-soft: #33413A; --portrait-bg: #24332B; --icon-bg: #2C3E35;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 540px; margin: 0 auto; padding-block: 0 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
.ankara { height: 10px; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); background:
  repeating-linear-gradient(90deg, var(--stay) 0 18px, var(--gold) 18px 24px, var(--japa) 24px 42px, var(--gold) 42px 48px); }
header.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-top: 14px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1; margin: 0; letter-spacing: -0.01em; }

.sub { color: var(--muted); font-size: 13px; }

.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
@media (max-width: 600px) { .lookbtn, .lang button { min-height: 40px; padding-block: 8px; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
.money { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.money div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.num.big { font-size: 19px; }
.up { color: var(--bad); } .down { color: var(--good); }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px 16px; }
.stat { display: grid; grid-template-columns: 82px 1fr 30px; align-items: center; gap: 8px; font-size: 13px; }

.track h3 { margin: 0 0 4px; font-size: 13px; font-weight: 700; }
.track.j h3 { color: var(--japa); } .track.s h3 { color: var(--stay); }

.track li { display: flex; gap: 6px; align-items: baseline; }

.track li.ok::before { background: var(--good); border-color: var(--good); }
.track li.note::before { content: none; }
.phase-tabs { display: flex; gap: 4px; font-size: 11.5px; font-weight: 600; color: var(--muted); flex-wrap: wrap; }
.phase-tabs span { padding: 3px 8px; border-radius: 999px; background: var(--chip); }
.phase-tabs span.on { background: var(--ink); color: var(--bg); }
.blocks { display: flex; gap: 3px; flex-wrap: wrap; }
.blocks i { width: 12px; height: 12px; border-radius: 3px; background: var(--gold); }
.blocks i.used { background: var(--chip); }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.card { text-align: left; border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; font: inherit; min-width: 0; }
.card:hover:not(:disabled) { border-color: var(--ink); }
.card:focus-visible, button:focus-visible, input:focus-visible { outline: 2.5px solid var(--gold); outline-offset: 2px; }
.card[aria-pressed="true"] { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 14%, var(--surface)); }
.card:disabled { opacity: .45; cursor: not-allowed; }
.card .t { font-weight: 700; font-size: 14px; line-height: 1.2; }
.card .meta { display: flex; justify-content: space-between; font-family: var(--font-num); font-size: 11.5px; color: var(--muted); gap: 6px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: 11px; padding: 1px 6px; border-radius: 999px; background: var(--chip); color: var(--ink); white-space: nowrap; }
.tag.j { color: var(--japa); font-weight: 700; } .tag.s { color: var(--stay); font-weight: 700; }
.btn { border: 0; border-radius: 10px; padding: 12px 16px; font: 700 15px var(--font-body); background: var(--ink); color: var(--bg); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.event { display: flex; flex-direction: column; gap: 10px; }
.who { display: flex; gap: 10px; align-items: center; }
.avatar { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-family: var(--font-display); color: #fff; background: var(--stay); }
.avatar.j { background: var(--japa); } .avatar.g { background: var(--gold); } .avatar.b { background: var(--bad); }
.quote { font-style: italic; color: var(--muted); }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice { text-align: left; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface-2); color: var(--ink); padding: 10px 12px; cursor: pointer; font: inherit; display: flex; flex-direction: column; gap: 3px; }
.choice:hover { border-color: var(--ink); }
.choice small { color: var(--muted); font-size: 12px; }
.result { background: var(--surface-2); border-left: 3px solid var(--gold); padding: 10px 12px; border-radius: 6px; }
table.ledger { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.ledger td { padding: 5px 0; border-bottom: 1px dashed var(--line); }

table.ledger tr.total td { border-bottom: 0; font-weight: 700; padding-top: 8px; }
.pos { color: var(--good); } .neg { color: var(--bad); }
.log { font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; max-height: 180px; overflow-y: auto; }
.log b { color: var(--ink); font-weight: 600; }
.setup label { font-weight: 600; font-size: 13px; }
.setup input[type=text] { width: 100%; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; font: inherit; background: var(--surface-2); color: var(--ink); }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
.opt { border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 10px; padding: 9px 10px; text-align: left; cursor: pointer; font: inherit; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.opt[aria-pressed="true"] { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 14%, var(--surface)); }
.opt small { color: var(--muted); font-size: 11.5px; }
.lifecard { border: 2px solid var(--ink); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }
.lifecard .ending { font-family: var(--font-display); font-weight: 800; font-size: 28px; line-height: 1.05; }
.lifecard .pg { font-size: 17px; font-weight: 600; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; max-width: 90vw; }
.note { font-size: 12px; color: var(--muted); }
.scene { display: block; width: 100%; height: 96px; border-radius: 10px; }
.opt .scene { height: 44px; border-radius: 6px; margin-bottom: 4px; }
.lifecard .scene { height: 120px; }
.face { display: block; flex: none; width: 52px; height: 52px; }
.face.lg { width: 76px; height: 76px; }
.ci { width: 20px; height: 20px; flex: none; color: var(--muted); }
.card .head { display: flex; gap: 8px; align-items: flex-start; }
.card[aria-pressed="true"] .ci { color: var(--gold); }
.me { display: flex; gap: 10px; align-items: center; min-width: 0; }
.looks { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; }
.swatch[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold); }
.lookbtn { border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 999px; padding: 6px 12px; font: 600 13px var(--font-body); cursor: pointer; }
.lookbtn[aria-pressed="true"] { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 14%, var(--surface)); }
.preview { display: flex; gap: 14px; align-items: flex-start; }
.face.xl { width: 112px; height: 112px; }
.face.photo { border-radius: 50%; box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--line); }
.face.av { border-radius: 50%; box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--line); }
.avbuild { display: flex; gap: 16px; align-items: flex-start; }
.avprev { display: flex; flex-direction: column; align-items: center; gap: 10px; flex: none; }
.avprev .face.xl { width: 136px; height: 136px; }
.avopts { display: flex; flex-direction: column; gap: 10px; flex: 1; min-width: 0; }
.avopts .looks small.note { min-width: 46px; }
.avopts .swatch { width: 28px; height: 28px; }
.avtabs { align-self: flex-start; flex-wrap: wrap; }
@media (max-width: 480px) { .avbuild { flex-direction: column; align-items: stretch; } .avprev { flex-direction: row; justify-content: center; } }
.fx { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.fxc { font-family: var(--font-num); font-size: 11.5px; padding: 2px 7px; border-radius: 999px; background: var(--chip); color: var(--ink); white-space: nowrap; }
.fxc.pos { color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--surface)); }
.fxc.neg { color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--surface)); }
.weekfx { display: flex; flex-direction: column; gap: 2px; }
.weekfx .fx { margin-top: 0; }
.intro { border: 1.5px solid var(--gold); background: color-mix(in srgb, var(--gold) 10%, var(--surface)); }
.intro ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.foot { max-width: 540px; margin: 0 auto; padding-block: 8px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); font-size: 12px; color: var(--muted); }
.foot a { color: inherit; }

.follow { display: flex; flex-direction: column; gap: 8px; }

.offchip { display: inline-block; margin-top: 6px; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--good) 35%, transparent); }
.offchip.now { color: var(--gold); background: color-mix(in srgb, var(--gold) 14%, var(--surface)); border-color: color-mix(in srgb, var(--gold) 45%, transparent); }
.help h3 { font-family: var(--font-display); font-weight: 600; font-size: 16px; margin: 6px 0 0; }

.share { display: flex; flex-direction: column; gap: 12px; }

.share .pic img { width: 100%; height: 100%; display: block; }
.share .row { flex-wrap: wrap; }
.share .row .btn { flex: 1 1 160px; text-align: center; text-decoration: none; }
.share .msg { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin: 0; white-space: pre-wrap; }
.helptabs { align-self: flex-start; }
.helptabs button { font-size: 13px; padding: 8px 16px; }
.eg-intro { margin: 0; font-size: 16px; }
.eg { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.eg > summary { cursor: pointer; list-style: none; padding: 12px 14px; display: flex; align-items: center; gap: 10px; font: 600 17px/1.25 var(--font-display); min-height: 48px; }
.eg > summary::-webkit-details-marker { display: none; }
.eg > summary::before { content: "+"; flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--chip); color: var(--stay); font: 800 18px/26px var(--font-body); text-align: center; }

.eg-body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; font-size: 15px; line-height: 1.55; }
.eg-body p { margin: 0; }

.eg-dl { display: grid; grid-template-columns: minmax(0, 9.5rem) minmax(0, 1fr); gap: 6px 12px; margin: 0; }
.eg-dl dt { font-weight: 700; } .eg-dl dd { margin: 0; }

.eg-tbl { width: 100%; border-collapse: collapse; font-size: 14.5px; }

.eg-blocks { display: flex; flex-wrap: wrap; gap: 3px; max-width: 260px; }

.eg-card { border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; max-width: 300px; display: flex; flex-direction: column; gap: 4px; background: var(--surface-2); }
.eg-card .tg { display: flex; flex-wrap: wrap; gap: 5px; } .eg-card .tg span { background: var(--chip); border-radius: 6px; padding: 0 7px; font-size: 13px; font-weight: 600; }
@media (max-width: 480px) { .eg-dl { grid-template-columns: 1fr; gap: 0; } .eg-dl dd { margin-bottom: 6px; } }
.endings { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }

.end.got.stay { border-left-color: var(--stay); }

.daily-teaser { border: 1.5px solid var(--gold); }

const salesBase = () => { const B = S.build; return Math.round(price(10000) * S.biz * (1 + 0.15 * B.staff) * (1 + 0.5 * (B.branches - 1)) * (0.6 + B.rep / 125) * hustleBoost() / 100) * 100; };

const HOME_ASKERS = [

const CARDS = {

function dealHand() {
  if (S.abroad) {
    const always = ['a_rest', 'a_shift'];
    if (S.abroad.cc > 0) always.push('a_paycard');
    if (CARDS.a_remit.can()) always.push('a_remit');
    // the next settling step is always dealt while you lean towards staying abroad
    if (S.resolve > -10) { const next = ['a_course', 'a_lifetest', 'a_lifestudy'].find(k => CARDS[k].can()); if (next) always.push(next); }
    else if (CARDS.a_land.can()) always.push('a_land');
    return fillHand(always, k => CARDS[k].ab);
  }
  if (S.build) {
    const always = ['rest', 'b_shop'];
    if (S.debt > 0) always.push('repay');
    if (CARDS.b_house.can()) always.push('b_house'); // the hometown house is always on offer when the builders are ready
    // one growth goal is always dealt
    const goals = ['b_restock', 'b_cac', 'b_hire', 'b_branch', 'b_campaign', 'b_house'].filter(k => CARDS[k].can());
    if (goals.length) always.push(pick(goals));
    return fillHand(always, k => CARDS[k].bd || SHARED_BUILD.includes(k));
  }
  const always = ['rest'];
  if (S.job) always.push('work'); else always.push('jobhunt'); // never leave an unemployed player without a way to look for work
  if (S.debt > 0) always.push('repay');
  if (CARDS.convert.can()) always.push('convert');
  // the next step on the path you lean toward is always dealt
  if (S.resolve > 10) { const nextJapa = ['passport', 'test', 'study', 'apply'].find(k => CARDS[k].can()); if (nextJapa) always.push(nextJapa); }
  if (S.resolve < -10 && CARDS.stock.can()) always.push('stock');
  return fillHand(always, k => !CARDS[k].ab && !CARDS[k].bd);
}
function fillHand(always, ok) {
  const pool = Object.keys(CARDS).filter(k => ok(k) && !always.includes(k) && CARDS[k].can());
  const hand = [...always];
  while (hand.length < 10 && pool.length) hand.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  S.hand = hand; S.picked = [];
}
const blocksUsed = () => S.picked.reduce((a, k) => a + CARDS[k].blocks, 0);
const moneyCommitted = () => S.picked.reduce((a, k) => a + CARDS[k].cost(), 0);

function pgResult(s) {
  if (PGR[s]) return PGR[s];
  for (const [rx, f] of PGRX) { const m = s.match(rx); if (m) return f(m); }
  return s;
}
function eventView(q) {
  const v = EV[q.id].view(q.p);
  if (LANG !== 'pg' || !PGV[q.id]) return v;
  const pv = PGV[q.id](q.p);
  return { ...v, title: pv.title, text: pv.text, choices: v.choices.map((c, i) => ({ ...c, ...((pv.choices || [])[i] || {}) })) };
}

/* ---------- effects: show players exactly what a choice, a week or a settle-up changed ---------- */
const snap = () => ({ money: S.money, usd: S.usd, energy: S.energy, mood: S.mood, health: S.health, family: S.family, community: S.community, clout: S.clout, resolve: S.resolve, debt: S.debt });
function fxChips(a, b, noMoney) {
  const out = [], d = k => Math.round((b[k] || 0) - (a[k] || 0)), sg = v => v > 0 ? '+' : '−';
  if (!noMoney) {
    if (d('money')) out.push({ v: d('money'), s: `${sg(d('money'))}${naira(Math.abs(d('money')))}` });
    if (d('usd')) out.push({ v: d('usd'), s: `${sg(d('usd'))}${usd(Math.abs(d('usd')))}` });
  }
  for (const k of ['energy', 'mood', 'health', 'family', 'community']) if (d(k)) out.push({ v: d(k), s: `${sg(d(k))}${Math.abs(d(k))} ${t(k).toLowerCase()}` });
  if (d('clout')) out.push({ v: d('clout'), s: `${sg(d('clout'))}${Math.abs(d('clout')).toLocaleString()} fans` });
  if (d('debt') > 0) out.push({ v: -1, s: `+${naira(d('debt'))} ${t('debtWord')}` });
  if (d('resolve')) { const toJapa = d('resolve') > 0; out.push({ v: 0, s: `${t('leaning')} ${(toJapa ? (S.abroad ? t('settleAb') : t('japa')) : (S.abroad ? t('goHome') : t('stay'))).toLowerCase()}` }); }
  return out;
}
const chipsHtml = list => list && list.length ? `<div class="fx">${list.map(c => `<span class="fxc ${c.v > 0 ? 'pos' : c.v < 0 ? 'neg' : ''}">${esc(c.s)}</span>`).join('')}</div>` : '';

/* ---------- week flow ---------- */
function endWeek() {
  const results = [], before = snap();
  for (const k of S.picked) { const c = CARDS[k]; spend(c.cost()); results.push(`<b>${c.name}:</b> ${c.run()}`); }
  results.forEach(r => log(r));
  S.queue = [];
  const ab = !!S.abroad;
  if (!ab && [2, 19, 37, 54, 71, 89].includes(S.week)) queueEvent('school');
  if (!ab && (S.week === 49 || S.week === 101)) queueEvent('detty');
  if (ab && S.week === 101 && weeksAbroad() >= 12) queueEvent('a_detty');
  if (chance(0.02) && EV.devalue.cond()) queueEvent('devalue');
  // illness: not two weeks running, so it never becomes an every-week event
  if (S.health < 35 && S.sickWeek !== S.week - 1) { queueEvent(ab ? 'a_sick' : 'sick'); S.sickWeek = S.week; }
  if (!ab && S.debt > price(300000) && timesThisYear('loanshame') < 2 && chance(0.4)) queueEvent('loanshame');
  // no event repeats within the last 3 weeks (unless nothing else is possible)
  const recent = S.recent || [];
  let pool = (ab ? ABROAD_POOL : S.build ? BUILD_POOL : RANDOM_POOL).filter(id => (!EV[id].cond || EV[id].cond()) && S.week - lastSeen(id) >= (MIN_GAP[id] || 0));
  const fresh = pool.filter(id => !recent.includes(id) && !S.queue.some(q => q.id === id));
  if (fresh.length) pool = fresh;
  else pool = chance(0.5) ? [] : [ab ? 'a_quiet' : 'y_quiet'];
  if (pool.length) {
    queueEvent(pick(pool));
    if (chance(0.35)) { const second = pick(pool); if (!S.queue.some(q => q.id === second)) queueEvent(second); }
  }
  S.recent = [...S.queue.map(q => q.id), ...recent].slice(0, 6);
  normalize();
  S.weekFx = fxChips(before, snap());
  // a quiet week with nothing happening: go straight to the money summary
  if (!S.queue.length) { const b2 = snap(); settle(); S.settleFx = fxChips(b2, snap(), true); return; }
  S.phase = 'life'; S.result = null; S.resultFx = null;
}
function choose(i) {
  const q = S.queue[0], before = snap();
  const hadBadge = S.streetSmart;

function helpView() {

    <p style="margin:0">You are a fresh graduate with ₦200,000. Over two in-game years you decide: <b style="color:var(--japa)">japa</b> (leave Nigeria) or <b style="color:var(--stay)">stay</b> and build at home. Neither is the right answer.</p>

    <h3>Each week has 3 steps</h3>

    <ul>
      <li><b>Energy</b> drops when you work. Rest brings it back. Below 15, your health suffers.</li>

      <li><b>Mood, family bond and community</b> slowly fall every week. Chill, call home, go to church or mosque, attend owambes. Very low mood means fewer fans and more quarrels at home.</li>
      <li>The <b>meter</b> shows which way you are leaning. The cards you are dealt follow it.</li>
      <li>Run out of money and a <b>loan app</b> covers you, with interest, taking 30% of your cash until it is paid.</li>

    <h3>Year 1 (weeks 1–52): choose a path</h3>
    <div class="tracks">
      <div class="track j"><h3>To japa</h3><ul>

      </ul><p class="note">Then the visa interview comes. If approved, choose at the airport.</p></div>
      <div class="track s"><h3>To stay</h3><ul>
        <li>Get a job (job hunt)</li><li>Buy stock until your business is level 6</li><li>Save enough for the shop lease</li>
      </ul><p class="note">Then sign the lease, or press "Keep building at home" at the end of Year 1.</p></div>
    </div>
    <p class="note" style="margin:0">Tip: pick one path early. Doing a bit of both usually gets you neither.</p>

    <h3>Year 2 (weeks 53–104, or earlier if you fly or sign a shop lease in Year 1)</h3>
    <ul>
      <li><b style="color:var(--japa)">Abroad chapter:</b> work care home shifts, finish the senior carer course, pass the Life in Northland test, live there 40 weeks and save $4,000 to settle. Or buy a plot of land at home and save $5,000: you will be offered the trip home to build (say "Not yet" if you want to stay longer). Avoid cash-in-hand gigs: 3 visa warnings and you are sent home.</li>
      <li><b style="color:var(--stay)">Build chapter:</b> run and restock the shop, hire staff, register with CAC and open branches for an empire. Or attend town union meetings and run for councillor. Or build your hometown house in 8 stages.</li>

    <h3>Daily Naija Wahala</h3>
    <p style="margin:0">Press <b>🔥 Daily wahala</b> at the top for one dilemma a day, the same for every player. You get one choice per day, and it does not affect your main game. Playing on back-to-back days builds your <b>streak</b>; every day you play counts toward your street rank (JJC at the start, then Street Learner at 3 days, Sharp Guy at 7, Street Smart at 14, Wahala Expert at 30 and Agba Survivor at 60). Share your result with the button under it. A new wahala arrives at midnight.</p>

    <h3>Endings</h3>
    <p style="margin:0">Each run ends with a life card and a Pidgin verdict, like <i>Settled Abroad</i>, <i>Back to Base</i>, <i>Odogwu</i> or <i>Changemaker</i>. Press <b>${t('newGame')}</b> to try the other path.</p>

    <p class="note" style="margin:0">Watch out: "double your money" schemes and "visa guaranteed" agents are scams. Spotting them earns the Street Smart badge. <b>New game</b> at the top starts over at any time.</p>

    <h3>About this game</h3>

// turn one of the game's SVG drawings into a standalone picture with real colours (no page styles)
function svgForCanvas(html, w, h) {
  const root = document.documentElement, had = root.getAttribute('data-theme');
  root.setAttribute('data-theme', 'light'); // the card always uses the light palette
  const cs = getComputedStyle(root);
  const resolve = str => str.replace(/var\((--[\w-]+)(?:,\s*([^)]+))?\)/g, (m, name, fb) => (cs.getPropertyValue(name).trim() || (fb || '#888').trim()));
  const tmp = document.createElement('div'); tmp.innerHTML = html;
  const svg = tmp.querySelector('svg'); let out = '';
  if (svg) { svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg'); svg.setAttribute('width', w); svg.setAttribute('height', h); svg.removeAttribute('class'); out = resolve(svg.outerHTML); }
  if (had === null) root.removeAttribute('data-theme'); else root.setAttribute('data-theme', had);
  return out;
}
const loadImg = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; });
function wrapLines(ctx, text, maxW) {
  const words = text.split(' '), lines = []; let line = '';
  for (const w of words) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line); return lines;
}

  function env(g, t, peak, dur) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); }
  function tone(type, f0, f1, t, dur, vol, dest, cutoff) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur * 0.6);
    env(g, t, vol, dur);
    if (cutoff) { const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff; o.connect(f); f.connect(g); } else o.connect(g);
    g.connect(dest); o.start(t); o.stop(t + dur + 0.02);
  }
  function hiss(t, dur, vol, type, freq, dest) {
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noise; f.type = type; f.frequency.value = freq; env(g, t, vol, dur);
    s.connect(f); f.connect(g); g.connect(dest); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  }
  function playStep(s, t) {
    const bar = BARS[(s >> 4) % 4], i = s & 15;
    if ([0, 6, 10].includes(i)) tone('sine', 140, 45, t, 0.28, 0.8, musicBus);                         // kick
    hiss(t, 0.045, [2, 6, 10, 14].includes(i) ? 0.16 : 0.06, 'highpass', 7000, musicBus);               // shaker
    if (i === 4 || i === 12) hiss(t, 0.06, 0.14, 'bandpass', 1900, musicBus);                           // rim
    const bassSteps = { 0: 'root', 3: 'root', 7: 'fifth', 10: 'root', 14: 'fifth' };
    if (bassSteps[i]) { const f = bar[bassSteps[i]]; tone('sine', f * 1.5, f, t, 0.26, 0.42, musicBus); } // log drum bass
    const pluckSteps = [0, 3, 6, 8, 10, 12, 14], pat = [3, 1, 2, 0, 2, 1, 3];
    const k = pluckSteps.indexOf(i);
    if (k >= 0) tone('triangle', bar.arp[pat[k]] * 2, null, t, 0.22, 0.09, musicBus, 2600);             // guitar
  }
  function tick() { while (nextTime < ctx.currentTime + 0.12) { playStep(step, nextTime); nextTime += SPS; step = (step + 1) % 64; } }
  function startMusic() {
    if (!ensure() || timer) return;
    step = 0; nextTime = ctx.currentTime + 0.06;
    musicBus.gain.cancelScheduledValues(ctx.currentTime); musicBus.gain.setTargetAtTime(0.32, ctx.currentTime, 0.4);
    timer = setInterval(tick, 25);
  }
  function stopMusic() {
    if (timer) { clearInterval(timer); timer = null; }
    if (ctx) musicBus.gain.setTargetAtTime(0, ctx.currentTime, 0.1);
  }
  const FX = {
    tap: t => tone('sine', 660, 880, t, 0.08, 0.3, sfxBus),
    untap: t => tone('sine', 560, 400, t, 0.08, 0.25, sfxBus),
    error: t => { tone('square', 180, 160, t, 0.09, 0.12, sfxBus, 900); tone('square', 180, 150, t + 0.12, 0.12, 0.12, sfxBus, 900); },
    drum: t => { tone('sine', 230, 120, t, 0.2, 0.7, sfxBus); tone('sine', 330, 170, t + 0.13, 0.22, 0.6, sfxBus); hiss(t, 0.05, 0.2, 'bandpass', 2000, sfxBus); },
    choose: t => { tone('triangle', 523.25, null, t, 0.12, 0.3, sfxBus); tone('triangle', 783.99, null, t + 0.08, 0.18, 0.28, sfxBus); },
    coins: t => [1318.5, 1568, 2093].forEach((f, i) => tone('sine', f, null, t + i * 0.06, 0.18, 0.22, sfxBus)),
    thud: t => { tone('sine', 120, 55, t, 0.35, 0.7, sfxBus); hiss(t, 0.1, 0.08, 'lowpass', 400, sfxBus); },
    fanfare: t => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone('triangle', f, null, t + i * 0.12, i === 3 ? 0.7 : 0.16, 0.3, sfxBus)),
    unlock: t => { FX.fanfare(t); [2093, 2637, 3136].forEach((f, i) => tone('sine', f, null, t + 0.5 + i * 0.07, 0.3, 0.12, sfxBus)); }
  };
  return {
    get mode() { return mode; },
    label() { return mode === 'all' ? '♪ Music + sound' : mode === 'sfx' ? '♪ Sound only' : '♪ Sound off'; },
    cycle() { mode = mode === 'off' ? 'all' : mode === 'all' ? 'sfx' : 'off'; try { localStorage.setItem('jos-sound', mode); } catch (e) {} this.apply(); },
    apply() { if (mode === 'all') startMusic(); else stopMusic(); },
    wake() { if (mode !== 'off' && (!ctx || ctx.state !== 'running' || (mode === 'all' && !timer))) { ensure(); this.apply(); } },
    play(name) { if (mode === 'off' || !ensure() || !FX[name]) return; FX[name](ctx.currentTime + 0.01); },
    pause(hidden) { if (!ctx) return; if (hidden) ctx.suspend().catch(() => {}); else if (mode !== 'off') ctx.resume().catch(() => {}); }
  };
})();
document.addEventListener('visibilitychange', () => Sound.pause(document.hidden));

/* ---------- offline badge: shows once the website has saved the game on this device ---------- */
let offlineCapable = false, offlineReady = false;
try { offlineCapable = 'serviceWorker' in navigator && location.protocol === 'https:' && window.self === window.top; } catch (e) {}
function updateOffline() {
  const el = document.getElementById('offchip');
  if (!el) return;
  if (!offlineReady) { el.hidden = true; return; }
  const on = navigator.onLine !== false;
  el.hidden = false;
  el.classList.toggle('now', !on);
  el.textContent = on ? `✓ ${t('offReady')}` : `● ${t('offNow')}`;
  el.title = on ? 'The game is saved on this device. You can play without data after this visit.' : 'No internet right now. Your game still works and saves on this device.';
}
if (offlineCapable) {
  try { navigator.serviceWorker.ready.then(() => { offlineReady = true; updateOffline(); }).catch(() => {}); } catch (e) {}
}
addEventListener('online', updateOffline);
addEventListener('offline', updateOffline);

/* ---------- install as an app (only offered on the website, where the browser supports it) ---------- */
let installPrompt = null, installed = false, showInstall = false;
const isStandalone = () => { try { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) { return false; } };
const canOfferInstall = () => offlineCapable && !installed && !isStandalone();
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; render(); });
addEventListener('appinstalled', () => { installPrompt = null; installed = true; showInstall = false; render(); toast('Installed. You can now play from your home screen, even offline.'); });
function installSteps() {
  const ua = navigator.userAgent || '';
  const ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const android = /Android/.test(ua);
  if (ios && !/Safari/.test(ua.replace(/CriOS|FxiOS|EdgiOS/g, 'X'))) return ['Open this page in <b>Safari</b> (installing works best there).', 'Tap the <b>Share</b> button (the square with an arrow pointing up).', 'Scroll down and tap <b>Add to Home Screen</b>, then <b>Add</b>.'];
  if (ios) return ['Tap the <b>Share</b> button (the square with an arrow pointing up) at the bottom of Safari.', 'Scroll down and tap <b>Add to Home Screen</b>.', 'Tap <b>Add</b>. Japa or Stay now has its own icon.'];
  if (android) return ['Tap the browser menu (<b>⋮</b> in Chrome, <b>≡</b> in Samsung Internet).', 'Tap <b>Install app</b> or <b>Add to Home screen</b>.', 'Tap <b>Install</b> or <b>Add</b>. Japa or Stay now has its own icon.'];
  return ['In Chrome or Edge, click the <b>install icon</b> at the right of the address bar (a screen with a down arrow).', 'Or open the browser menu and choose <b>Install Japa or Stay</b> (Edge: <b>Apps → Install this site as an app</b>).', 'Click <b>Install</b>. It opens in its own window and works offline.'];
}
// Share the game itself (any time), as opposed to "Share my life" at the end of a life
let showShareGame = false;
const gameShareText = () => `Japa or stay? 🇳🇬 I'm playing a free Naija life-sim game: two years, one choice, 22 endings. In English or Pidgin, and it works offline. Play free: ${SHARE_URL} (follow ${SOCIAL_HANDLE})`;
function shareGameView() {
  const t = encodeURIComponent(gameShareText()), u = encodeURIComponent(SHARE_URL), short = encodeURIComponent("Japa or stay? 🇳🇬 A free Naija life-sim game with 22 endings, in English or Pidgin. Play free:");
  const links = [
    ['WhatsApp', `https://wa.me/?text=${t}`],
    ['X', `https://x.com/intent/post?text=${short}&url=${u}`],
    ['Facebook', `https://www.facebook.com/sharer/sharer.php?u=${u}`],
    ['Telegram', `https://t.me/share/url?url=${u}&text=${short}`],
    ['LinkedIn', `https://www.linkedin.com/sharing/share-offsite/?url=${u}`]
  ];
  const icon = n => (SOCIAL.find(x => x[0] === n) || [])[2] || '';
  return `<section class="panel share">
    <div class="row between"><h2>Share Japa or Stay</h2><button class="btn ghost" data-act="sharegame-close">Back</button></div>
    <p style="margin:0">Know someone who's thinking about japa, or about staying to build? Send them the game.</p>
    ${navigator.share ? '<button class="btn" data-act="sharegame-native">Share…</button>' : ''}
    <div class="soc">${links.map(([n, l]) => `<a href="${l}" target="_blank" rel="noopener" aria-label="Share on ${n}"><svg viewBox="0 0 24 24" aria-hidden="true">${icon(n)}</svg>${n}</a>`).join('')}
      <a href="#" data-act="sharegame-copy" aria-label="Copy the game link"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>Copy link</a></div>
    <p class="note" style="margin:0">The message that goes with it:</p>
    <p class="msg">${esc(gameShareText())}</p>
    ${S && S.phase === 'end' ? '<p class="note" style="margin:0">Finished a life? <b>Share my life</b> on the end screen sends a picture of your ending.</p>' : ''}
  </section>`;
}
function installView() {
  return `<section class="panel help">
    <div class="row between"><h2>Install Japa or Stay</h2><button class="btn" data-act="install-close">${S ? 'Back to my game' : 'Back'}</button></div>
    <p style="margin:0">Put the game on your home screen. It opens full-screen like an app and plays without data after your first visit.</p>
    <ol>${installSteps().map(s => `<li>${s}</li>`).join('')}</ol>
    <p class="note" style="margin:0">Your saved game and endings stay the same after installing.</p>
  </section>`;
}

function toast(m) { const el = document.getElementById('toast'); el.textContent = m; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 1800); }

document.addEventListener('click', e => {
  Sound.wake(); // browsers only allow audio to start after a click
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, before = S && S.phase;
  if (a === 'sound') { Sound.cycle(); render(); Sound.play('tap'); return; }
  if (a === 'install') {
    if (installPrompt) { const p = installPrompt; installPrompt = null; p.prompt(); p.userChoice.then(c => { if (c && c.outcome === 'accepted') installed = true; render(); }).catch(() => {}); }
    else { showInstall = true; showDaily = false; showHelp = false; showHall = false; showShareGame = false; render(); window.scrollTo({ top: 0 }); }
    return;
  }
  if (a === 'daily') { if (!S) setup.name = (document.getElementById('nm') || {}).value || setup.name; showDaily = true; showHelp = false; showHall = false; showShare = false; showShareGame = false; showInstall = false; render(); window.scrollTo({ top: 0 }); return; }
  if (a === 'daily-close' || a === 'daily-play') { showDaily = false; render(); window.scrollTo({ top: 0 }); return; }
  if (a === 'daily-choose') { const up = playWahala(Number(b.dataset.i)); render(); Sound.play(up ? 'unlock' : 'choose'); if (up) toast(`New street rank: ${LG(rankOf(loadDaily().days)[1], rankOf(loadDaily().days)[2])}`); return; }
  if (a === 'daily-share') { navigator.share({ text: wahalaShareText() }).catch(() => {}); return; }
  if (a === 'daily-copy') { const tx = wahalaShareText(); (navigator.clipboard ? navigator.clipboard.writeText(tx) : Promise.reject()).then(() => toast('Result copied'), () => toast('Could not copy.')); return; }
  if (a === 'sharegame') { showDaily = false; if (!S) setup.name = (document.getElementById('nm') || {}).value || setup.name; showShareGame = true; showHelp = false; showHall = false; showShare = false; render(); window.scrollTo({ top: 0 }); return; }
  if (a === 'sharegame-close') { showShareGame = false; render(); window.scrollTo({ top: 0 }); return; }
  if (a === 'sharegame-native') { navigator.share({ title: 'Japa or Stay', text: gameShareText(), url: SHARE_URL }).catch(() => {}); return; }
  if (a === 'sharegame-copy') { e.preventDefault(); const tx = gameShareText(); (navigator.clipboard ? navigator.clipboard.writeText(tx) : Promise.reject()).then(() => toast('Link copied'), () => toast('Could not copy. Select the message and copy it.')); return; }
  if (a === 'install-close') { showInstall = false; render(); window.scrollTo({ top: 0 }); return; }
  if (a === 'share') { openShare(); return; }
  if (a === 'share-close') { showShare = false; render(); return; }
  if (a === 'share-copy') { const tx = shareText(); (navigator.clipboard ? navigator.clipboard.writeText(tx) : Promise.reject()).then(() => toast('Message copied'), () => toast('Could not copy. Select the message and copy it.')); return; }
  if (a === 'share-native') {
    const tx = shareText(), file = sharePic && new File([sharePic.blob], 'japa-or-stay-life.png', { type: 'image/png' });
    const data = file && navigator.canShare && navigator.canShare({ files: [file] }) ? { files: [file], text: tx } : { text: tx, url: SHARE_URL };
    navigator.share(data).catch(() => {}); return;
  }
  if (a === 'helpmode') { helpMode = b.dataset.v; render(); return; }
  if (a === 'lang') { LANG = b.dataset.v; try { localStorage.setItem('jos-lang', LANG); } catch (er) {} render(); return; }
  if (a === 'region') { setup.name = document.getElementById('nm').value || setup.name; setup.region = b.dataset.v; render(); return; }
  if (a === 'trait') { setup.name = document.getElementById('nm').value || setup.name; setup.trait = b.dataset.v; render(); return; }
  if (a === 'av' || a === 'avt' || a === 'av-rand' || a === 'avtab') {
    setup.name = document.getElementById('nm').value || setup.name;
    const k = b.dataset.k, val = b.dataset.v;
    if (a === 'avtab') lookTab = val;
    else if (a === 'av-rand') setup.av = randomAv();
    else if (a === 'avt') setup.av[k] = !setup.av[k];
    else {
      setup.av[k] = ['skin', 'hc', 'oc'].includes(k) ? Number(val) : val;
      if (k === 'body' && val === 'f') setup.av.beard = false; // switching to Woman removes the beard
      if (k === 'body' && val === 'm') setup.av.earrings = false; // and to Man takes the earrings off (both can be turned back on in Extras)
    }
    const y = window.scrollY; render(); window.scrollTo({ top: y }); return;
  }
  if (a === 'start') { const n = (document.getElementById('nm').value || 'Ada').trim().slice(0, 20); S = newState(n, setup.region, setup.trait, AV_SKINS[setup.av.skin], 'custom'); S.av = { ...setup.av }; dealHand(); log(`<b>Start:</b> ${esc(n)} begins life in ${REG().name} with ${naira(S.money)}.`); save(); }
  if (a === 'card') { const k = b.dataset.k; if (S.picked.includes(k)) { S.picked = S.picked.filter(x => x !== k); Sound.play('untap'); } else {
      const c = CARDS[k]; if (c.blocks > BLOCKS - blocksUsed()) { Sound.play('error'); toast('Not enough time this week'); return; }
      const short = c.cost() - (wallet() - moneyCommitted());
      if (short > loanRoom()) { Sound.play('error'); toast(t('notEnough')); return; }
      if (short > 0) toast(t('loanToast'));
      S.picked.push(k); Sound.play('tap'); } save(); }
  if (a === 'build') { startBuild(false); dealHand(); S.phase = 'plan'; save(); Sound.play('choose'); }
  if (a === 'japa2') { startJapaY2(); dealHand(); S.phase = 'plan'; save(); Sound.play('choose'); }
  if (a === 'start') Sound.play('choose');
  if (a === 'intro-ok' || a === 'start' || a === 'intro-guide') { introSeen = true; try { localStorage.setItem('jos-intro', '1'); localStorage.setItem('jos-intro2', '1'); } catch (er) {} }
  if (a === 'intro-guide') { if (!S) setup.name = (document.getElementById('nm') || {}).value || setup.name; helpMode = 'easy'; showHelp = true; showHall = false; render(); window.scrollTo({ top: 0 }); return; }
  if (a === 'intro-ok' && S) { render(); return; }
  if (a === 'end') { endWeek(); Sound.play('drum'); }
  if (a === 'choose') { choose(Number(b.dataset.i)); Sound.play('choose'); }
  if (a === 'next') nextEvent();
  if (a === 'nextweek') nextWeek();
  if (['help', 'hall', 'install', 'newgame'].includes(a)) { showShareGame = false; showDaily = false; }
  if (a === 'help') { if (!S) setup.name = (document.getElementById('nm') || {}).value || setup.name; showHelp = true; showHall = false; render(); window.scrollTo({ top: 0 }); return; }
  if (a === 'hall') { if (!S) setup.name = (document.getElementById('nm') || {}).value || setup.name; showHall = true; showHelp = false; render(); window.scrollTo({ top: 0 }); return; }
  if (a === 'hall-close') { showHall = false; render(); window.scrollTo({ top: 0 }); return; }
  if (a === 'help-close') { showHelp = false; render(); window.scrollTo({ top: 0 }); return; }
  if (a === 'newgame') { confirmReset = true; render(); window.scrollTo({ top: 0 }); return; }
  if (a === 'reset-no') { confirmReset = false; }
  if (a === 'restart') showShare = false;
  if (a === 'restart') { confirmReset = false; S = null; try { localStorage.removeItem('jos-save'); } catch (er) {} }
  if (S && before !== S.phase) {
    if (S.phase === 'settle' && S.ledger) Sound.play(S.ledger.lines.reduce((x, [, v]) => x + v, 0) >= 0 ? 'coins' : 'thud');
    if (S.phase === 'end') Sound.play(S.newUnlock ? 'unlock' : 'fanfare');
  }
  render();
  // mid-week steps: jump to the play area (cards, event or money summary), not the top of the page, so phone players don't scroll past the stats every time
  const tabs = document.querySelector('.phase-tabs');
  if (['end', 'next', 'nextweek'].includes(a) && tabs) tabs.scrollIntoView({ behavior: 'smooth', block: 'start' });
  else if (['end', 'next', 'nextweek', 'start', 'restart'].includes(a)) window.scrollTo({ top: 0, behavior: 'smooth' });
});

window.claude?.hot?.snapshot?.(() => ({ S, setup }));
const boot = d => { if (d && d.S) { S = d.S; if (d.setup) setup = d.setup; } else load(); if (location.hash === '#wahala') showDaily = true; render(); };
addEventListener('hashchange', () => { if (location.hash === '#wahala') { showDaily = true; render(); } });
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
